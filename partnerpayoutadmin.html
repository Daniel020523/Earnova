<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payout Requests — Admin — EarnOva</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .tab-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab-btn{
    border:1px solid rgba(0,0,0,0.15); border-radius:999px; padding:8px 16px;
    font-size:13px; font-weight:600; background:none; cursor:pointer; opacity:0.75;
  }
  .tab-btn.active{ background:rgba(0,0,0,0.85); color:#fff; opacity:1; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill-active{ background:rgba(0,150,80,0.15); color:#0a7a4a; }
  .pill-pending{ background:rgba(200,150,0,0.15); color:#8a6400; }
  .pill-rejected{ background:rgba(220,38,38,0.12); color:#dc2626; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table{ width:100%; min-width:720px; border-collapse:collapse; white-space:nowrap; }
  .data-table th, .data-table td{ padding:12px 16px; text-align:left; border-bottom:1px solid rgba(0,0,0,0.08); }
  .data-table th{ font-size:12px; text-transform:uppercase; letter-spacing:0.03em; opacity:0.6; font-weight:600; }
  .empty-row{ opacity:0.6; }
  .stat-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; }
  .stat-box{ flex:1 1 160px; padding:16px 18px; border-radius:12px; background:rgba(0,0,0,0.04); }
  .stat-box .label{ font-size:12px; opacity:0.65; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .stat-box .value{ font-size:22px; font-weight:700; margin-top:6px; }
  .row-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .row-actions button{ font-size:12px; padding:7px 12px; }
  .btn-danger{ background:none; border:1px solid rgba(220,38,38,0.4); color:#dc2626; border-radius:8px; cursor:pointer; }
  .btn-approve{ background:rgba(0,150,80,0.9); border:none; color:#fff; border-radius:8px; cursor:pointer; }
  .btn-paid{ background:rgba(0,0,0,0.85); border:none; color:#fff; border-radius:8px; cursor:pointer; }
  .mono{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; opacity:0.8; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box{ background:#fff; border-radius:14px; padding:22px; max-width:380px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .modal-box h3{ margin:0 0 10px 0; font-size:17px; }
  .modal-box p{ margin:0 0 16px 0; font-size:14px; opacity:0.8; line-height:1.5; }
  .modal-box textarea{ width:100%; padding:10px 12px; border:1px solid rgba(0,0,0,0.15); border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:16px; resize:vertical; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .modal-actions button{ font-size:13px; padding:9px 16px; border-radius:8px; }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">
      <span class="name"><span class="earn">Earn</span><span class="ova">Ova</span></span>
      <span class="tag">Think smart. Earn big.</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="#" id="logoutBtn">Log out</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="kicker">Admin</div>
  <h1>Payout requests</h1>
  <p class="lead">Review, approve, and pay out partner payout requests.</p>

  <div class="stat-row">
    <div class="stat-box">
      <div class="label">Pending</div>
      <div class="value" id="stat-pending">—</div>
    </div>
    <div class="stat-box">
      <div class="label">Approved (legacy, awaiting payment)</div>
      <div class="value" id="stat-approved">—</div>
    </div>
    <div class="stat-box">
      <div class="label">Paid out (all time)</div>
      <div class="value" id="stat-paid">—</div>
    </div>
  </div>

  <div class="tab-bar" style="margin-top:24px;">
    <button type="button" class="tab-btn active" data-filter="pending">Pending</button>
    <button type="button" class="tab-btn" data-filter="approved">Approved</button>
    <button type="button" class="tab-btn" data-filter="paid">Paid</button>
    <button type="button" class="tab-btn" data-filter="rejected">Rejected</button>
    <button type="button" class="tab-btn" data-filter="all">All</button>
    <button type="button" class="btn btn-ghost" id="refreshBtn" style="margin-left:auto;">Refresh</button>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table class="data-table" id="payout-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Partner</th>
            <th>Amount</th>
            <th>Bank</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="payout-table-body"><tr><td colspan="6" class="empty-row">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<footer>
  <div class="footer-links">
    <a href="support.html">Support</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact us</a>
  </div>
  <div class="copyright">© EarnOva. All rights reserved. 2026</div>
</footer>

<div class="toast" id="toast"></div>
<script>
  // ---------------------------------------------------------
  // Supabase setup — replace with your project's real values
  // (Project Settings > API in the Supabase dashboard)
  // ---------------------------------------------------------
  const SUPABASE_URL = "https://vrgqbyowlfqrtjumzeqq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PgoMJxVK_CQiyhHoXMunrQ_hgByUSzW";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------------------------------------------------------
  // Schema this page expects (see payout_lifecycle_and_transactions.sql
  // for the full script):
  //
  // profiles: needs is_admin boolean not null default false
  //
  // partner_payout_requests: needs processed_at timestamptz,
  //   processed_by uuid, rejection_reason text
  //
  // Balance handling has moved earlier in the lifecycle than it used
  // to be, and the admin flow is now two-stage instead of three:
  //   - The partner's balance is deducted the moment they submit a
  //     payout request (a DB trigger on partner_payout_requests),
  //     not when an admin approves or pays it out.
  //   - "Approve & pay" calls the SECURITY DEFINER function
  //     admin_mark_payout_paid(p_payout_id uuid), which verifies the
  //     caller is an admin and flips a 'pending' request straight to
  //     'paid'. It does NOT touch the balance — that already happened
  //     at request time.
  //   - "Reject" is a plain status update (pending -> rejected), but a
  //     DB trigger automatically refunds the amount back to the
  //     partner's balance and logs a credit transaction whenever a
  //     request's status becomes 'rejected'. This page doesn't need to
  //     do anything extra for the refund to happen.
  //   - The 'approved' status and its "Mark paid" button are kept
  //     around only to handle any rows created before this change —
  //     new requests never pass through 'approved' anymore.
  // ---------------------------------------------------------

  let toastTimer;
  function showToast(msg, durationMs = 2600) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), durationMs);
  }

  // On mobile there's no easy way to open a dev console, so surface any
  // otherwise-silent JS error as an on-screen toast instead of letting
  // it vanish. This is what will tell us exactly what's failing if a
  // button still appears to "do nothing" after tapping it.
  window.addEventListener('error', (event) => {
    console.error('Uncaught error:', event.error || event.message);
    showToast('JS error: ' + (event.message || 'see details'), 6000);
  });
  window.addEventListener('unhandledrejection', (event) => {
    console.error('Unhandled promise rejection:', event.reason);
    const msg = (event.reason && event.reason.message) ? event.reason.message : String(event.reason);
    showToast('Error: ' + msg, 6000);
  });

  function formatCurrency(amount) {
    const value = Number(amount) || 0;
    return '₦' + value.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // Custom confirmation modal — deliberately does NOT use window.confirm()
  // or window.prompt(). Native dialogs like those are frequently blocked
  // or silently no-op inside sandboxed webviews / embedded previews,
  // which makes buttons that depend on them look like they "do nothing"
  // when clicked. This works everywhere because it's just DOM + CSS.
  function showConfirmModal({ title, message, confirmLabel = 'Confirm', danger = false, withReason = false }) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(message)}</p>
          ${withReason ? `<textarea id="modal-reason-input" rows="2" placeholder="Reason (optional)"></textarea>` : ''}
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
            <button type="button" class="${danger ? 'btn-danger' : 'btn-approve'}" id="modal-confirm-btn">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const cleanup = (result) => {
        overlay.remove();
        resolve(result);
      };

      overlay.querySelector('#modal-cancel-btn').addEventListener('click', () => cleanup({ confirmed: false, reason: null }));
      overlay.addEventListener('click', (event) => {
        if (event.target === overlay) cleanup({ confirmed: false, reason: null });
      });
      overlay.querySelector('#modal-confirm-btn').addEventListener('click', () => {
        const reasonInput = overlay.querySelector('#modal-reason-input');
        const reason = reasonInput ? (reasonInput.value.trim() || null) : null;
        cleanup({ confirmed: true, reason });
      });
    });
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function shortId(id) {
    return id ? id.slice(0, 8) : '—';
  }

  const logoutBtn = document.getElementById('logoutBtn');
  logoutBtn.addEventListener('click', async (event) => {
    event.preventDefault();
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  let currentAdmin = null;
  let allRequests = [];
  let activeFilter = 'pending';

  async function requireAdminSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return null;
    }

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('is_admin')
      .eq('id', session.user.id)
      .single();

    if (profileError) {
      console.error('Profile check error:', profileError);
      showToast('Could not verify your account. Please try again.');
      window.location.href = 'dashboard.html';
      return null;
    }

    if (profile?.is_admin === true) {
      return session.user;
    }

    showToast('This page is only available to admin accounts.');
    window.location.href = 'dashboard.html';
    return null;
  }

  function payoutStatusPill(status) {
    if (status === 'paid') return '<span class="pill pill-active">Paid</span>';
    if (status === 'approved') return '<span class="pill pill-active">Approved</span>';
    if (status === 'rejected') return '<span class="pill pill-rejected">Rejected</span>';
    return '<span class="pill pill-pending">Pending</span>';
  }

  function actionButtons(request) {
    if (request.status === 'pending') {
      return `
        <div class="row-actions">
          <button type="button" class="btn-approve" data-action="approve" data-id="${request.id}">Approve &amp; pay</button>
          <button type="button" class="btn-danger" data-action="reject" data-id="${request.id}">Reject</button>
        </div>`;
    }
    if (request.status === 'approved') {
      // Legacy rows only — new requests go straight from pending to paid.
      return `
        <div class="row-actions">
          <button type="button" class="btn-paid" data-action="paid" data-id="${request.id}">Mark paid</button>
          <button type="button" class="btn-danger" data-action="reject" data-id="${request.id}">Reject</button>
        </div>`;
    }
    return '<span style="opacity:0.5; font-size:12px;">—</span>';
  }

  function renderStats() {
    const pending = allRequests.filter(r => r.status === 'pending');
    const approved = allRequests.filter(r => r.status === 'approved');
    const paid = allRequests.filter(r => r.status === 'paid');
    const sum = arr => arr.reduce((total, r) => total + (Number(r.amount) || 0), 0);

    document.getElementById('stat-pending').textContent = `${pending.length} • ${formatCurrency(sum(pending))}`;
    document.getElementById('stat-approved').textContent = `${approved.length} • ${formatCurrency(sum(approved))}`;
    document.getElementById('stat-paid').textContent = formatCurrency(sum(paid));
  }

  function renderTable() {
    const tbody = document.getElementById('payout-table-body');
    const rows = activeFilter === 'all'
      ? allRequests
      : allRequests.filter(r => r.status === activeFilter);

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-row">No ${activeFilter === 'all' ? '' : activeFilter + ' '}payout requests.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${formatDate(r.created_at)}</td>
        <td>
          <div>${escapeHtml(r.bank_account_name || '—')}</div>
          <div class="mono">${shortId(r.partner_id)}</div>
        </td>
        <td>${formatCurrency(r.amount)}</td>
        <td>${escapeHtml(r.bank_name)} • ${escapeHtml(r.bank_account_number)}</td>
        <td>${payoutStatusPill(r.status)}${r.status === 'rejected' && r.rejection_reason ? `<div class="field-hint" style="margin-top:4px;">${escapeHtml(r.rejection_reason)}</div>` : ''}</td>
        <td>${actionButtons(r)}</td>
      </tr>
    `).join('');
  }

  async function loadPayoutRequests() {
    const tbody = document.getElementById('payout-table-body');
    tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Loading…</td></tr>';

    const { data, error } = await supabaseClient
      .from('partner_payout_requests')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Payout requests load error:', error);
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Could not load payout requests.</td></tr>';
      return;
    }

    allRequests = data || [];
    renderStats();
    renderTable();
  }

  document.querySelectorAll('.tab-btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderTable();
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', loadPayoutRequests);

  document.getElementById('payout-table-body').addEventListener('click', async (event) => {
    const btn = event.target.closest('button[data-action]');
    if (!btn || !currentAdmin) return;

    const id = btn.dataset.id;
    const action = btn.dataset.action;

    try {
      if (action === 'approve') {
        const { confirmed } = await showConfirmModal({
          title: 'Approve & pay this payout?',
          message: "The balance was already deducted when the partner requested it — this confirms the transfer has been sent.",
          confirmLabel: 'Approve & pay'
        });
        if (!confirmed) return;

        btn.disabled = true;
        try {
          const { error } = await supabaseClient.rpc('admin_mark_payout_paid', { p_payout_id: id });
          if (error) throw error;
          showToast('Payout approved and marked as paid.');
          await loadPayoutRequests();
        } catch (err) {
          console.error('Approve error:', err);
          showToast(err.message || 'Could not approve payout.');
          btn.disabled = false;
        }
        return;
      }

      if (action === 'reject') {
        const { confirmed, reason } = await showConfirmModal({
          title: 'Reject this payout?',
          message: "The amount will be refunded to the partner's balance automatically.",
          confirmLabel: 'Reject payout',
          danger: true,
          withReason: true
        });
        if (!confirmed) return;

        btn.disabled = true;
        try {
          const { error } = await supabaseClient
            .from('partner_payout_requests')
            .update({
              status: 'rejected',
              rejection_reason: reason,
              processed_at: new Date().toISOString(),
              processed_by: currentAdmin.id
            })
            .eq('id', id)
            .in('status', ['pending', 'approved']);
          if (error) throw error;
          showToast('Payout rejected and refunded to the partner.');
          await loadPayoutRequests();
        } catch (err) {
          console.error('Reject error:', err);
          showToast(err.message || 'Could not reject payout.');
          btn.disabled = false;
        }
        return;
      }

      if (action === 'paid') {
        const { confirmed } = await showConfirmModal({
          title: 'Mark as paid?',
          message: "The balance was already deducted when the partner requested it, so this just records that the transfer was completed.",
          confirmLabel: 'Mark paid'
        });
        if (!confirmed) return;

        btn.disabled = true;
        try {
          const { error } = await supabaseClient.rpc('admin_mark_payout_paid', { p_payout_id: id });
          if (error) throw error;
          showToast('Payout marked as paid.');
          await loadPayoutRequests();
        } catch (err) {
          console.error('Mark paid error:', err);
          showToast(err.message || 'Could not mark payout as paid.');
          btn.disabled = false;
        }
        return;
      }
    } catch (err) {
      // Catches anything unexpected (e.g. a problem building/showing the
      // modal itself) so a click never fails completely silently.
      console.error('Payout action error:', err);
      showToast('Something went wrong. Please try again.');
      btn.disabled = false;
    }
  });

  (async function init() {
    currentAdmin = await requireAdminSession();
    if (currentAdmin) {
      await loadPayoutRequests();
    }
  })();
</script>

</body>
</html>
