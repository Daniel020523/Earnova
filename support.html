<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — EarnOva</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="nav">
    <a href="earnova.html" class="logo">
      <span class="name"><span class="earn">Earn</span><span class="ova">Ova</span></span>
      <span class="tag">Think big. Earn smart.</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="login.html">Log in</a>
      <a class="btn btn-solid" href="signup.html">Sign up</a>
    </div>
  </div>
</header>

<main class="page">
  <a href="earnova.html" class="back-link">&larr; Back to home</a>
  <div class="kicker">We're here to help</div>
  <h1>Support</h1>
  <p class="lead">Tell us what's going on and our team will get back to you within 24 hours.</p>

  <form class="card" onsubmit="event.preventDefault(); showToast('Your request has been sent to our support team.');">
    <label for="topic">What do you need help with?</label>
    <input id="topic" type="text" placeholder="e.g. Payout not received" required>
    <label for="details">Details</label>
    <input id="details" type="text" placeholder="Briefly describe the issue" required>
    <button type="submit" class="btn btn-solid">Send request</button>
  </form>
  <div class="switch-line">Looking for quick answers? Check the <a href="faq.html">FAQ</a></div>
</main>

<footer>
  <div class="footer-links">
    <a href="support.html">Support</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact us</a>
  </div>
  <div class="copyright">© EarnOva. All rights reserved. 2026</div>
</footer>

<div class="toast" id="toast"></div>
<script>
  let toastTimer;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }
</script>

</body>
</html>
