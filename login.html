<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EarnOva</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="nav">
    <a href="earnova.html" class="logo">
      <span class="name"><span class="earn">Earn</span><span class="ova">Ova</span></span>
      <span class="tag">Think big. Earn smart.</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="login.html">Log in</a>
      <a class="btn btn-solid" href="signup.html">Sign up</a>
    </div>
  </div>
</header>

<main class="page">
  <a href="earnova.html" class="back-link">&larr; Back to home</a>
  <div class="kicker">Welcome back</div>
  <h1>Log in to EarnOva</h1>
  <p class="lead">Access your dashboard, track your earnings, and request a payout.</p>

  <form class="card" onsubmit="event.preventDefault(); showToast('Logged in — redirecting to your dashboard…');">
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" required>
    <button type="submit" class="btn btn-solid">Log in</button>
  </form>
  <div class="switch-line">New to EarnOva? <a href="signup.html">Create an account</a></div>
</main>

<footer>
  <div class="footer-links">
    <a href="support.html">Support</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact us</a>
  </div>
  <div class="copyright">© EarnOva. All rights reserved. 2026</div>
</footer>

<div class="toast" id="toast"></div>
<script>
  let toastTimer;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }
</script>

</body>
</html>
