<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — EarnOva</title>
<style>
  body{ font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center;
        height:100vh; margin:0; background:#0f1115; color:#fff; text-align:center; }
  .box{ padding:24px; }
  .spinner{ width:28px; height:28px; margin:0 auto 16px; border-radius:50%;
            border:3px solid rgba(255,255,255,0.2); border-top-color:#fff;
            animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  p{ opacity:0.75; font-size:14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Redirecting you now…</p>
    <p id="debug-line" style="font-size:12px; opacity:0.5; margin-top:12px;"></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://vrgqbyowlfqrtjumzeqq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PgoMJxVK_CQiyhHoXMunrQ_hgByUSzW";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const DESTINATION_URL = "https://omg10.com/4/11475054";
  const DEVICE_KEY = "eo_device_id";

  function getDeviceId(){
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id){
      id = crypto.randomUUID();
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  }

  function goToDestination(){
    window.location.replace(DESTINATION_URL);
  }

  function showDebug(msg){
    const el = document.getElementById('debug-line');
    if (el) el.textContent = msg;
  }

  async function run(){
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    const debugMode = params.get('debug') === '1';

    if (!ref){
      showDebug(debugMode ? 'No ?ref= param found.' : '');
      setTimeout(goToDestination, debugMode ? 3000 : 600);
      return;
    }

    let resultText = '';
    try {
      const deviceId = getDeviceId();
      const { data, error } = await supabaseClient.rpc('claim_referral_click', {
        p_ref_code: ref,
        p_device_id: deviceId
      });
      if (error){
        resultText = 'RPC error: ' + error.message;
        console.error('claim_referral_click error:', error);
      } else {
        // {ok:true} = rewarded. {ok:false, reason:'already_claimed'|'invalid_code'|'self_click'} = not rewarded, on purpose.
        resultText = 'Result: ' + JSON.stringify(data);
        console.log('claim_referral_click result:', data);
      }
    } catch (e) {
      resultText = 'Threw: ' + e.message;
      console.error('referral tracking failed', e);
    }

    showDebug(debugMode ? resultText : '');
    setTimeout(goToDestination, debugMode ? 4000 : 600);
  }

  run();
</script>
</body>
</html>
