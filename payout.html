<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Payout — EarnOva</title>
<link rel="stylesheet" href="styles.css">
<style>
  .payout-card{
    max-width:480px;
  }
  .balance-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 0;
    border-bottom:1px solid rgba(0,0,0,0.08);
    margin-bottom:16px;
  }
  .balance-label{
    font-size:13px;
    opacity:0.7;
  }
  .balance-value{
    font-size:26px;
    font-weight:700;
  }
  .destination-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    background:rgba(0,0,0,0.03);
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
  }
  .destination-row a{
    font-size:13px;
    font-weight:600;
    color:#3b5bdb;
    text-decoration:none;
  }
  .destination-row a:hover{
    text-decoration:underline;
  }
  .form-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:16px;
  }
  .form-row label{
    font-size:13px;
    font-weight:600;
    opacity:0.8;
  }
  .form-row input{
    padding:10px 12px;
    border:1px solid rgba(0,0,0,0.15);
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
    letter-spacing:4px;
  }
  .form-row input:focus{
    outline:none;
    border-color:#3b5bdb;
  }
  .form-error{
    color:#c0392b;
    font-size:13px;
    margin-bottom:12px;
    display:none;
  }
  .setup-notice{
    background:#fff8e6;
    border:1px solid #f0d68a;
    border-radius:8px;
    padding:14px;
    font-size:14px;
    margin-bottom:16px;
  }
  .setup-notice a{
    color:#3b5bdb;
    font-weight:600;
    text-decoration:none;
  }
  .setup-notice a:hover{
    text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="dashboard.html" class="logo">
      <span class="name"><span class="earn">Earn</span><span class="ova">Ova</span></span>
      <span class="tag">Think smart. Earn big.</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="dashboard.html">Dashboard</a>
      <a class="btn btn-ghost" href="#" id="logout-btn">Log out</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="kicker">Payout</div>
  <h1>Request payout</h1>
  <p class="lead">Send your available balance to your linked bank account.</p>

  <div id="payout-loading" class="card">
    <p>Loading…</p>
  </div>

  <div id="payout-content" class="card payout-card" style="display:none;">

    <div class="balance-row">
      <span class="balance-label">Available balance</span>
      <span class="balance-value" id="available-balance">₦0.00</span>
    </div>

    <div id="setup-notice" class="setup-notice" style="display:none;">
      <span id="setup-notice-text"></span>
    </div>

    <div id="destination-row" class="destination-row" style="display:none;">
      <span id="destination-text">—</span>
      <a href="account.html">Change</a>
    </div>

    <p class="form-error" id="payout-error"></p>

    <form id="payout-form">
      <div class="form-row">
        <label for="pin-input">Enter your withdrawal PIN</label>
        <input type="password" id="pin-input" inputmode="numeric" maxlength="6" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-solid" id="submit-btn">Confirm payout</button>
      <a class="btn btn-ghost" href="dashboard.html" style="margin-left:8px;">Cancel</a>
    </form>

  </div>

  <div id="payout-error-box" class="card" style="display:none;">
    <p id="payout-error-text"></p>
    <a class="btn btn-solid" href="login.html">Go to log in</a>
  </div>

</main>

<footer>
  <div class="footer-links">
    <a href="support.html">Support</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact us</a>
  </div>
  <div class="copyright">© EarnOva. All rights reserved. 2026</div>
</footer>

<div class="toast" id="toast"></div>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://vrgqbyowlfqrtjumzeqq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PgoMJxVK_CQiyhHoXMunrQ_hgByUSzW";
  const VERIFY_PIN_URL = `${SUPABASE_URL}/functions/v1/verify-withdrawal-pin`;

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUserId = null;
  let currentAvailableBalance = 0;
  let hasLinkedAccount = false;
  let hasWithdrawalPin = false;
  let toastTimer;

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function formatNaira(n){
    return n.toLocaleString('en-NG', { style: 'currency', currency: 'NGN' });
  }

  function showPageError(msg){
    document.getElementById('payout-loading').style.display = 'none';
    document.getElementById('payout-content').style.display = 'none';
    const errBox = document.getElementById('payout-error-box');
    document.getElementById('payout-error-text').textContent = msg;
    errBox.style.display = 'block';
  }

  function showFormError(msg){
    const el = document.getElementById('payout-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function loadPayoutPage(){
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
      window.location.href = 'login.html';
      return;
    }

    const user = session.user;
    currentUserId = user.id;

    const [balanceResult, linkedAccountResult, profileResult] = await Promise.all([
      Promise.all([
        supabaseClient.from('transactions').select('amount').eq('user_id', user.id).eq('type', 'earning').eq('status', 'completed'),
        supabaseClient.from('transactions').select('amount').eq('user_id', user.id).eq('type', 'payout'),
        supabaseClient.from('transactions').select('amount').eq('user_id', user.id).eq('type', 'refund').eq('status', 'completed'),
        supabaseClient.from('transactions').select('amount').eq('user_id', user.id).eq('type', 'referral').eq('status', 'completed')
      ]),
      supabaseClient.from('linked_accounts').select('bank_name, account_number, account_name').eq('user_id', user.id).maybeSingle(),
      supabaseClient.from('profiles').select('has_withdrawal_pin').eq('id', user.id).single()
    ]);

    const [
      { data: earningRows, error: earningError },
      { data: payoutRows, error: payoutError },
      { data: refundRows, error: refundError },
      { data: referralRows, error: referralError }
    ] = balanceResult;
    const { data: linkedAccount, error: linkedAccountError } = linkedAccountResult;
    const { data: profile, error: profileError } = profileResult;

    if (earningError || payoutError || refundError || referralError || profileError) {
      showPageError("We couldn't load your payout details. Please try again.");
      return;
    }

    const totalEarned = (earningRows || []).reduce((sum, row) => sum + Number(row.amount || 0), 0);
    const totalPaidOut = (payoutRows || []).reduce((sum, row) => sum + Number(row.amount || 0), 0);
    const totalRefunded = (refundRows || []).reduce((sum, row) => sum + Number(row.amount || 0), 0);
    const totalReferral = (referralRows || []).reduce((sum, row) => sum + Number(row.amount || 0), 0);
    currentAvailableBalance = totalEarned - totalPaidOut + totalRefunded + totalReferral;
    document.getElementById('available-balance').textContent = formatNaira(currentAvailableBalance);

    hasLinkedAccount = !linkedAccountError && !!linkedAccount;
    hasWithdrawalPin = !!(profile && profile.has_withdrawal_pin);

    const submitBtn = document.getElementById('submit-btn');
    const notice = document.getElementById('setup-notice');
    const noticeText = document.getElementById('setup-notice-text');

    if (hasLinkedAccount) {
      const last4 = (linkedAccount.account_number || '').slice(-4);
      document.getElementById('destination-text').textContent =
        `${linkedAccount.bank_name}${last4 ? ' •••• ' + last4 : ''}`;
      document.getElementById('destination-row').style.display = 'flex';
    }

    const missing = [];
    if (!hasLinkedAccount) missing.push('link a bank account');
    if (!hasWithdrawalPin) missing.push('set a withdrawal PIN');

    if (missing.length > 0) {
      noticeText.innerHTML = `Before you can request a payout, please ${missing.join(' and ')}. ` +
        (!hasLinkedAccount ? '<a href="account.html">Link account</a>' : '') +
        (!hasLinkedAccount && !hasWithdrawalPin ? ' &middot; ' : '') +
        (!hasWithdrawalPin ? '<a href="settings.html">Set PIN</a>' : '');
      notice.style.display = 'block';
      submitBtn.disabled = true;
      document.getElementById('pin-input').disabled = true;
    } else if (currentAvailableBalance <= 0) {
      showFormError("You don't have any available balance to withdraw yet.");
      submitBtn.disabled = true;
      document.getElementById('pin-input').disabled = true;
    }

    document.getElementById('payout-loading').style.display = 'none';
    document.getElementById('payout-content').style.display = 'block';
  }

  document.getElementById('payout-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    document.getElementById('payout-error').style.display = 'none';

    if (!hasLinkedAccount || !hasWithdrawalPin) return;

    if (currentAvailableBalance <= 0) {
      showFormError("You don't have any available balance to withdraw yet.");
      return;
    }

    const pin = document.getElementById('pin-input').value;
    if (!/^\d{4,6}$/.test(pin)) {
      showFormError('Please enter your 4-6 digit PIN.');
      return;
    }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Verifying PIN…';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const resp = await fetch(VERIFY_PIN_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ pin })
      });
      const json = await resp.json();

      if (!resp.ok || !json.valid) {
        showFormError(json.error || 'Incorrect PIN. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm payout';
        document.getElementById('pin-input').value = '';
        return;
      }
    } catch (err) {
      showFormError("We couldn't verify your PIN. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm payout';
      return;
    }

    submitBtn.textContent = 'Submitting…';

    // Both the transactions row and the linked payout_requests row are
    // created together, server-side, inside a single Postgres function
    // (request_payout). That keeps them atomic — either both exist or
    // neither does — instead of two separate client inserts with a
    // rollback delete that regular users don't have permission to run.
    // The function also recomputes the available balance itself, so
    // the amount paid out can't be tampered with from the client.
    const { error: rpcError } = await supabaseClient.rpc('request_payout');

    if (rpcError) {
      showFormError(rpcError.message || "Couldn't submit your payout request. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm payout';
      return;
    }

    showToast('Payout request submitted!');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
  });

  document.getElementById('pin-input').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });

  document.getElementById('logout-btn').addEventListener('click', async (event) => {
    event.preventDefault();
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  loadPayoutPage();
</script>

</body>
</html>
